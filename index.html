    <style>
        body {
            height: 100vh;
            background: linear-gradient(#2e2e2e, #9198e5);
            background-repeat: no-repeat;
            background-size: contain;
        }

        #bloque2,
        #bloque1 {
            position: relative;
        }

        svg {
            position: absolute;
            height: auto;
        }


        #pantalanes {
            z-index: 0;
            width: 90%;

        }

        #pila {
            z-index: 1;
            width: 65%;
            margin-top:1em;
            margin-left: 0.5%;
        }

        #letras {
            z-index: 1;
            width: 70%;
            transform: translate(1em, -1em);
        }


        .letras-1,
        .letras-2 {
            font-size: 60px;
            fill: none;
            stroke: #000;
            stroke-miterlimit: 10;
            font-family: MyriadPro-Regular, Myriad Pro;
        }


        .porpintar {
            fill: #59ff00;
            background-color: #59ff00;
        }

        .pintado {
            fill: #ff00a6;
            background-color: #ff00a6;
        }

        .amedias {
            fill: #8670ff;
            background-color: #8670ff;
        }

        .nosepinta {
            fill: #bbb8b8;
            background-color: #bbb8b8;
        }

        .botones {
            display: none;
            flex-direction: column;
            gap: 1em;
            max-width: 100%;
            align-items: end;
            padding: 1em 2em;

        }

        .botones>div {
            border: 0.5px solid grey;
            width: 2em;
            height: 2em;
            border-radius: 50%;
        }

        .seve {
            display: flex;
        }
