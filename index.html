    <style>
        body {
            height: 100vh;
            background: linear-gradient(#2e2e2e, #9198e5);
            background-repeat: no-repeat;
            background-size: contain;
            margin: 0;
        }

        #bloque2,
        #bloque1 {
            position: relative;
        }

        svg {
            position: absolute;
            height: auto;
        }


        #pantalanes {
            z-index: 0;
            width: 90%;

        }

        #pila {
            z-index: 1;
            width: 67%;
            margin-top: 1em;
            margin-left: 3%;
        }

        #letras {
            z-index: 1;
            width: 69%;
            transform: translate(2em, 0em);
        }


        .letras-1,
        .letras-2 {
            font-size: 60px;
            fill: none;
            stroke: #000;
            stroke-miterlimit: 10;
            font-family: MyriadPro-Regular, Myriad Pro;
        }


        .porpintar {
            fill: #59ff00;
            background: linear-gradient(69deg,#59ff00cc,#59ff0062);
        }

        .pintado {
            fill: #ff00a6;
            background: linear-gradient(69deg,#ff00a6cc,#ff00a662);
        }

        .amedias {
            fill: #8670ff;
            background: linear-gradient(69deg,#8570ffdd,#8570ff88);
        }

        .nosepinta {
            fill: #bbb8b8;
            background: linear-gradient(69deg,#bbb8b8cc,#bbb8b862);
        }

        .pulsado {
            fill: #000;
        }

        .faltagorrete {
            fill: #fff;
            background: linear-gradient(69deg,#ffffffcc,#ffffff8c);
        }

        .botonesContainer {
            min-width: 5em;
            display: flex;
            justify-content: center;
            position: absolute;
            left: 0;
            width: 100vw;
            top: 0;
            height: 100vh;
        }
        
        .botones {
            z-index:999;
            backdrop-filter: blur(4px);
            display: none;
            /* flex-direction: column; */
            gap: 1em;
            /* max-width: 2em; */
            align-items: center;
            padding:3em;
            width: 100%;/*  */
            justify-content: start;
        }
        /* BOTONACHE */
        .botones>div {
            border: 0.5px solid rgba(255, 255, 255, 0.068);
            width: 5em;
            height: 5em;
            border-radius: 50%;
        }

        .seve {
            display: flex;
        }

        .infoContainer {
            display: flex;
            justify-content: end;
            height: 95vh;
            overflow-y: scroll;
        }

        #info {
            display: flex;
            flex-direction: column;
            /* font-size: 70%; */
            font-family: monospace;
            align-items: end;
            gap: 0.5em;
            padding: 2em 3em;
        }
    </style>
